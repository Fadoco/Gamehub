<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub - Sua Loja de Jogos</title>
    <link rel="stylesheet" href="css/style global.css">
    <link rel="stylesheet" href="css/home.css">
    <!-- Importação do Font Awesome para ícones (lupa, biblioteca, dados) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Scripts de carregamento dinâmico -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="java/firebase-config.js"></script>
    <script src="java/global.js" defer></script>
    <script src="java/home.js" defer></script>
    <script src="java/search.js" defer></script>
    <script src="java/auth.js" defer></script>
</head>
<body>
    <!-- 
        BARRA DE NAVEGAÇÃO SUPERIOR
        Contém a branding (logo) e as ferramentas globais (busca, biblioteca, etc)
    -->
    <header>
        <div class="container">
            <nav>
                <div class="logo" style="cursor:pointer" onclick="window.location.href='index.html'">GameHub</div>
                
                <div class="nav-items">
                    <!-- Área de pesquisa rápida -->
                    <div class="search-box">
                        <input type="text" placeholder="buscar">
                        <i class="fas fa-search"></i>
                    </div>

                    <!-- Links de acesso rápido às funcionalidades principais -->
                    <a href="#" id="nav-library" class="nav-button"><i class="fas fa-layer-group"></i> Biblioteca</a>
                    <a href="#" id="nav-cart" class="nav-button"><i class="fas fa-shopping-cart"></i> Carrinho</a>
                    <a href="#" class="nav-button roulette"><i class="fas fa-dice"></i> Roleta</a>
                    
                    <div class="user-profile" id="user-menu" style="display: none;">
                        <span id="user-name" style="margin-right: 10px; font-size: 14px; display: none;"></span>
                        <img src="https://ui-avatars.com/api/?name=User&background=e74c3c&color=fff" alt="Perfil">
                        <button id="btn-login" class="nav-button" style="background: none; border: 1px solid var(--accent); padding: 5px 10px; border-radius: 4px;">Entrar</button>
                        <button id="btn-logout" class="nav-button" style="display: none; font-size: 10px; color: var(--accent);">Sair</button>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <!-- 
        CONTEÚDO PRINCIPAL
        Abaixo do cabeçalho, organizado em uma grid de jogos responsiva.
    -->
    <main class="container">
        <div id="store-sections">
            <!-- O JavaScript criará as seções e títulos automaticamente aqui -->
            <p>Carregando categorias...</p>
        </div>
    </main>

    <!-- Modal de Login -->
    <div id="login-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Entrar no GameHub</h2>
            <form id="login-form">
                <div class="form-group">
                    <input type="email" id="email" placeholder="E-mail" required>
