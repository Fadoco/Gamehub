<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking de Usuários - GameHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel=\"stylesheet\" href=\"../css/style-global.css\">
    <style>
        main { padding-top: 40px; min-height: 80vh; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <div class="logo" onclick="window.location.href='../index.html'" style="cursor:pointer">GAMEHUB</div>
                <div class="nav-items">
                    <a href="../index.html" class="nav-button"><i class="fas fa-store"></i> Loja</a>
                    <a href="biblioteca.html" class="nav-button"><i class="fas fa-layer-group"></i> Biblioteca</a>
                    <a href="carrinho.html" class="nav-button"><i class="fas fa-shopping-cart"></i> Carrinho</a>
                    
                    <div id="user-wallet" class="wallet-widget" style="display: none;" onclick="window.location.href='historico.html'">
                        <i class="fas fa-wallet"></i>
                        <span id="wallet-amount">R$ 0,00</span>
                    </div>
                    <div class="user-profile" id="user-menu" style="display: none;">
                        <img src="https://ui-avatars.com/api/?name=User&background=27ae60&color=fff" alt="Perfil">
                        <button id="btn-login" class="nav-button">Entrar</button>
                        <button id="btn-logout" class="nav-button" style="display:none">Sair</button>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="ranking-container">
            <h1 style="text-align: center; color: var(--accent); margin-bottom: 10px;">🏆 Ranking de Riqueza</h1>
            <p style="text-align: center; color: var(--secondary); margin-bottom: 30px;">Os usuários com maior saldo na carteira GameHub.</p>
            
            <table class="ranking-table">
                <thead>
                    <tr>
                        <th>Posição</th>
                        <th>Usuário</th>
                        <th>Saldo</th>
                    </tr>
                </thead>
                <tbody id="ranking-list-body">
                    <!-- Preenchido via ranking.js -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../java/firebase-config.js"></script>
    <script src="../java/auth.js" defer></script>
    <script src="../java/global.js" defer></script>
    <script src="../java/ranking.js" defer></script>
</body>
</html>
