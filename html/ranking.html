<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking de Usuários - GameHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style-global.css">
    <link rel="stylesheet" href="../css/header-footer.css">
    <style>
        main { padding-top: 40px; min-height: 80vh; }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar__left">
            <div class="brand" onclick="window.location.href='../index.html'" style="cursor:pointer">GameHub</div>
            <nav class="topbar__menu">
                <a href="biblioteca.html">Biblioteca</a>
                <a href="../Roleta/roleta.html">Roleta</a>
                <a href="ranking.html" class="active">Ranking</a>
                <a href="carrinho.html">Carrinho</a>
            </nav>
        </div>
        <div class="topbar__actions">
            <div id="user-wallet" class="wallet-widget" style="display: none;" onclick="window.location.href='historico.html'">
                <i class="fas fa-coins"></i>
                <span id="wallet-amount">R$ 0,00</span>
            </div>
            
            <div class="user-profile" id="user-menu" style="display: none;">
                <span id="user-name" style="margin-right: 10px; font-size: 14px; display: none;"></span>
                <img src="https://ui-avatars.com/api/?name=User&background=e74c3c&color=fff" alt="Perfil" style="width: 35px; height: 35px; border-radius: 50%; cursor: pointer;">
                <button id="btn-login" class="btn btn-primary">Entrar</button>
                <button id="btn-logout" class="btn btn-ghost" style="display: none;">Sair</button>
            </div>
        </div>
    </header>

    <header class="main-header">
        <div class="searchbar">
            <i class="fas fa-search searchbar__icon"></i>
            <input type="text" id="main-search" placeholder="Pesquisar na loja..." aria-label="Pesquisar loja">
        </div>
        <nav class="section-nav">
            <button id="btn-random-game" class="btn btn-ghost" onclick="window.handleRandomGame()">
                <i class="fas fa-dice"></i> Jogo Aleatório
            </button>
        </nav>
    </header>

    <main class="container">
        <div class="ranking-container">
            <h1 style="text-align: center; color: var(--accent); margin-bottom: 10px;">🏆 Ranking de Riqueza</h1>
            <p style="text-align: center; color: var(--secondary); margin-bottom: 30px;">Os usuários com maior saldo na carteira GameHub.</p>
            
            <table class="ranking-table">
                <thead>
                    <tr>
                        <th>Posição</th>
                        <th>Usuário</th>
                        <th>Saldo</th>
                    </tr>
                </thead>
                <tbody id="ranking-list-body">
                    <!-- Preenchido via ranking.js -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../java/firebase-config.js"></script>
    <script src="../java/auth.js" defer></script>
    <script src="../java/global.js" defer></script>
    <script src="../java/ranking.js" defer></script>
</body>
</html>
