<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub - Detalhes do Jogo</title>
    <link rel="stylesheet" href="../css/style global.css">
    <link rel="stylesheet" href="../css/jogo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Scripts Firebase e Auth -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../java/firebase-config.js"></script>
    <script src="../java/auth.js" defer></script>
    <script src="../java/jogo.js" defer></script>
    <script src="../java/global.js" defer></script>
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <div class="logo" style="cursor:pointer" onclick="window.location.href='../index.html'">GameHub</div> <!-- Logo sempre volta para a raiz -->
                <div class="nav-items">
                    <div class="search-box">
                        <input type="text" placeholder="buscar">
                        <i class="fas fa-search"></i>
                    </div>
                    <a href="#" id="nav-library" class="nav-button"><i class="fas fa-layer-group"></i> Biblioteca</a>
                    <a href="#" id="nav-cart" class="nav-button"><i class="fas fa-shopping-cart"></i> Carrinho</a>
                    <a href="#" class="nav-button roulette"><i class="fas fa-dice"></i> Roleta</a>
                    
                    <div class="user-profile" style="display: none;">
                        <img src="https://ui-avatars.com/api/?name=User&background=e74c3c&color=fff" alt="Perfil">
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="back-navigation">
            <a href="../index.html" class="back-button"><i class="fas fa-arrow-left"></i> Voltar para a Loja</a>
        </div>

        <div class="game-detail-container">
            <div class="detail-header">
                <h1 id="game-title-detail">Carregando...</h1>
                <div id="game-platforms-detail" class="game-platforms"></div>
            </div>

            <div class="detail-content">
                <div class="detail-media">
                    <img id="game-image-detail" src="" alt="Imagem do Jogo">
                </div>

                <div class="detail-buy-box">
                    <div class="tags-row">
                        <strong>Categorias:</strong>
                        <span id="game-tags-detail"></span>
                    </div>
                    
                    <div class="price-section" id="game-price-detail">
                        <!-- Preenchido via JS -->
                    </div>

                    <button class="buy-button">Adicionar ao Carrinho</button>
                </div>
            </div>

            <div class="detail-description" style="margin-top: 40px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
                <h2 style="font-size: 1.2rem; margin-bottom: 15px; color: var(--secondary);">Sobre este jogo</h2>
                <p id="game-description-detail" style="line-height: 1.8; color: #bdc3c7; text-transform: none;"></p>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>GameHub</h3>
                    <p>Sua loja independente preferida para descobrir novos mundos.</p>
                </div>
                <div class="footer-section">
                    <h3>Suporte</h3>
                    <ul>
                        <li><a href="#">Ajuda</a></li>
                        <li><a href="#">Reembolsos</a></li>
                        <li><a href="#">Privacidade</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h3>Siga-nos</h3>
                    <div class="social-icons">
                        <a href="#"><i class="fab fa-discord"></i></a>
