<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Controle de Usuário</title>
    <link rel="stylesheet" href="../css/style global.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../java/firebase-config.js"></script>
    <script src="../java/auth.js" defer></script>
    <script src="../java/global.js" defer></script>
    <script src="../java/admin-user-detail.js" defer></script>
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <div class="logo" onclick="window.location.href='admin.html'" style="cursor:pointer">
                    <i class="fas fa-arrow-left"></i> Voltar ao Painel
                </div>
                <div id="target-user-header" style="text-transform: none; color: var(--accent); font-weight: bold;"></div>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="admin-grid">
            <!-- Informações Básicas e Saldo -->
            <section class="admin-card">
                <h2>Gerenciar Carteira</h2>
                <div id="user-info-display" style="margin-bottom: 20px; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 8px;">
                    <!-- Preenchido via JS -->
                </div>
                
                <div class="form-group">
                    <label>Novo Saldo (R$)</label>
                    <input type="number" step="0.01" id="new-balance-input" placeholder="Ex: 100.00">
                    <button class="buy-button" onclick="updateUserBalance()" style="margin-top: 10px; width: 100%;">Atualizar Saldo</button>
                </div>

                <div class="form-group" style="margin-top: 25px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
                    <label>Alterar Foto de Perfil (Arquivo)</label>
                    <input type="file" id="admin-edit-avatar" accept="image/*" class="file-input-compact">
                    
                    <label style="margin-top: 15px;">Alterar Banner (Arquivo)</label>
                    <input type="file" id="admin-edit-banner" accept="image/*,video/*" class="file-input-compact">
                    
                    <button class="nav-button" onclick="adminUploadMedia()" style="margin-top: 15px; width: 100%;">
                        <i class="fas fa-upload"></i> Upload de Mídias
                    </button>
                </div>
            </section>

            <!-- Gerenciar Biblioteca -->
            <section class="admin-card">
                <h2>Biblioteca do Usuário</h2>
                <div class="form-group">
                    <label>Adicionar Jogo por ID</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="number" id="add-game-id" placeholder="ID do Jogo (ex: 1)">
                        <button class="nav-button" onclick="addGameToUser()" style="white-space: nowrap;">Adicionar</button>
                    </div>
                </div>
                
                <div id="user-library-list" class="user-list-container" style="max-height: 300px; margin-top: 20px;">
                    <!-- Lista de jogos do usuário -->
                </div>
            </section>

            <!-- Histórico de Compras -->
            <section class="admin-card" style="grid-column: span 2;">
                <h2>Histórico de Transações</h2>
                <div class="admin-table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Itens</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody id="user-history-table"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
