<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Controle de Usuário</title>
    <link rel="stylesheet" href="../css/style-global.css">
    <link rel="stylesheet" href="../css/header-footer.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../java/firebase-config.js"></script>
    <script src="../java/auth.js" defer></script>
    <script src="../java/global.js" defer></script>
    <script src="../java/admin-user-detail.js" defer></script>
</head>
<body>
    <header class="topbar">
        <div class="topbar__left">
            <div class="brand" onclick="window.location.href='../index.html'" style="cursor:pointer">GameHub Admin</div>
            <nav class="topbar__menu">
                <a href="admin.html">Painel Admin</a>
                <a href="../index.html">Ver Loja</a>
            </nav>
        </div>
        <div class="topbar__actions">
            <div id="user-menu" style="display: flex; align-items: center; gap: 15px;"></div>
        </div>
    </header>

    <main class="container">
        <div style="margin: 20px 0; display: flex; justify-content: space-between; align-items: center;">
            <button class="btn btn-ghost" onclick="window.location.href='admin.html'">
                <i class="fas fa-arrow-left"></i> Voltar ao Painel
            </button>
            <h1 id="target-user-header" style="margin: 0; color: var(--accent); font-size: 1.5rem; text-transform: none;"></h1>
        </div>

        <div class="admin-grid">
            <!-- Informações Básicas e Saldo -->
            <section class="admin-card">
                <h2>Gerenciar Carteira</h2>
                <div id="user-info-display" style="margin-bottom: 20px; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 8px;">
                    <!-- Preenchido via JS -->
                </div>
                
                <div class="form-group">
                    <label>Novo Saldo (R$)</label>
                    <input type="number" step="0.01" id="new-balance-input" placeholder="Ex: 100.00">
                    <button class="admin-btn-primary" onclick="updateUserBalance()" style="width: 100%; margin-top: 15px;">Atualizar Saldo</button>
                </div>
            </section>

            <!-- Gerenciar Biblioteca -->
            <section class="admin-card">
                <h2>Biblioteca do Usuário</h2>
                <div class="form-group">
                    <label>Adicionar Jogo por ID</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="number" id="add-game-id" placeholder="ID do Jogo (ex: 1)">
                        <button class="admin-btn-primary" onclick="addGameToUser()" style="white-space: nowrap; padding: 10px 20px;">Adicionar</button>
                    </div>
                </div>
                
                <div id="user-library-list" class="user-list-container" style="max-height: 300px; margin-top: 20px;">
                    <!-- Lista de jogos do usuário -->
                </div>
            </section>

            <!-- Histórico de Compras -->
            <section class="admin-card" style="grid-column: span 2;">
                <h2>Histórico de Transações</h2>
                <div class="admin-table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Itens</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody id="user-history-table"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
