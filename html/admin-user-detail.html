<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Detalhes do Usuário - Gerencie informações do usuário.">
    <meta name="theme-color" content="#00d4ff">
    <title>Admin - Controle de Usuário</title>
    
    <!-- === CSS MODULARIZADO (Mobile-First) === -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/style-global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/utilities.css">
    <link rel="stylesheet" href="../css/responsive.css">
    
    <!-- === THEME SWITCHER === -->
    <link rel="stylesheet" href="../css/theme-switcher.css">
    
    <!-- === CSS ESPECÍFICO === -->
    <link rel="stylesheet" href="../css/header-footer.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/upgrades.css">
    
    <!-- === ÍCONES === -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- === FIREBASE === -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- === PERFORMANCE MODULES === -->
    <script src="../java/lazy-image-loader.js"></script>
    
    <script src="../java/firebase-config.js"></script>
    <script src="../java/firestore-cache.js"></script>
    <script src="../java/theme-switcher.js"></script>
    <script src="../java/notifications-manager.js" defer></script>
    <script src="../java/ranks.js" defer></script>
    <script src="../java/auth.js" defer></script>
    <script src="../java/global.js" defer></script>
    <script src="../java/admin-user-detail.js" defer></script>
</head>
<body>
    <header class="topbar">
        <div class="topbar__left">
            <div class="brand cursor-pointer" onclick="window.location.href='../index.html'">GameHub Admin</div>
            <nav class="topbar__menu">
                <a href="admin.html">Painel Admin</a>
                <a href="../index.html">Ver Loja</a>
            </nav>
        </div>
        <div class="topbar__actions">
            <!-- Botão de Notificações -->
            <div class="notifications-container" id="notifications-container">
                <button id="btn-notifications" class="notifications-button" title="Notificações">
                    <i class="fas fa-bell"></i>
                    <span id="notif-badge" class="notif-badge hidden">0</span>
                </button>
            </div>
            <div id="user-menu" class="flex items-center gap-3"></div>
        </div>
    </header>

    <!-- Painel de Notificações (Overlay Fixo) -->
    <div id="notif-dropdown" class="notif-dropdown">
        <div class="notif-header">Pedidos de Amizade</div>
        <div id="notif-list" class="notif-list">
            <div class="notif-empty">Nenhuma notificação nova.</div>
        </div>
    </div>

    <main class="container">
        <div class="my-5 flex justify-between items-center">
            <button class="btn btn-ghost" onclick="window.location.href='admin.html'">
                <i class="fas fa-arrow-left"></i> Voltar ao Painel
            </button>
            <h1 id="target-user-header" class="m-0 text-accent text-xl"></h1>
        </div>

        <div class="admin-grid">
            <!-- Informações Básicas e Saldo -->
            <section class="admin-card">
                <h2>Gerenciar Carteira</h2>
                <div id="user-info-display" class="mb-5 p-4 bg-dark rounded-md">
                    <!-- Preenchido via JS -->
                </div>
                
                <div class="form-group">
                    <label>Novo Saldo (R$)</label>
                    <input type="number" step="0.01" id="new-balance-input" placeholder="Ex: 100.00">
                    <button type="button" class="admin-btn-primary w-full mt-4" onclick="window.updateUserBalance()">Atualizar Saldo</button>
                </div>
            </section>

            <!-- Gerenciar Biblioteca -->
            <section class="admin-card">
                <h2>Biblioteca do Usuário</h2>
                <div class="form-group">
                    <label>Adicionar Jogo por ID</label>
                    <div class="flex gap-2.5">
                        <input type="number" id="add-game-id" placeholder="ID do Jogo (ex: 1)">
                        <button class="admin-btn-primary whitespace-nowrap p-2.5" onclick="addGameToUser()">Adicionar</button>
                    </div>
                </div>
                
                <div id="user-library-list" class="user-list-container max-h-sm mt-5">
                    <!-- Lista de jogos do usuário -->
                </div>
            </section>

            <!-- Histórico de Compras -->
            <section class="admin-card col-span-2">
                <h2>Histórico de Transações</h2>
                <div class="admin-table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Itens</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody id="user-history-table"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
