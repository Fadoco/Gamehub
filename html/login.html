<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub - Login</title>
    <link rel="stylesheet" href="../css/style global.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="../java/firebase-config.js"></script>
    <script src="../java/auth.js" defer></script>
    <style>
        .login-page-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-header) 100%);
        }
        .login-card {
            background: var(--bg-header);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 30px var(--shadow);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h1 {
            color: var(--accent);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .login-card p {
            color: #bdc3c7;
            margin-bottom: 25px;
        }
        .login-card .buy-button {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            border: none;
            color: white;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition);
            font-size: 16px;
        }
        .login-card .buy-button:hover {
            background: #c0392b;
            transform: scale(1.02);
        }
        .toggle-form {
            margin-top: 15px;
            font-size: 13px;
            color: var(--accent);
            cursor: pointer;
            text-decoration: underline;
        }
        .btn-google {
            width: 100%;
            padding: 12px;
            background: white;
            color: #444;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="login-page-container">
        <div class="login-card">
            <h1>GameHub</h1>
            
            <div id="login-section">
                <p>Acesse sua conta para entrar na loja</p>
                <form id="login-form">
                    <div class="form-group">
                        <input type="email" id="email" placeholder="E-mail" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="password" placeholder="Senha" required>
                    </div>
                    <p class="toggle-form" id="forgot-password-link" style="margin-bottom: 15px; display: block; text-align: right;">Esqueci minha senha</p>
                    <button type="submit" class="buy-button">Entrar no GameHub</button>
                    <button type="button" class="btn-google"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> Entrar com Google</button>
                </form>
                <p class="toggle-form" onclick="toggleForms()">Não tem conta? Cadastre-se</p>
            </div>

            <div id="signup-section" style="display: none;">
                <p>Crie sua conta no GameHub</p>
                <form id="signup-form">
                    <div class="form-group"><input type="text" id="signup-name" placeholder="Nome" required></div>
                    <div class="form-group"><input type="email" id="signup-email" placeholder="E-mail" required></div>
                    <div class="form-group"><input type="password" id="signup-password" placeholder="Senha (min. 6)" required></div>
                    <button type="submit" class="buy-button">Criar Conta</button>
                    <button type="button" class="btn-google"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> Cadastrar com Google</button>
                </form>
                <p class="toggle-form" onclick="toggleForms()">Já tem conta? Entrar</p>
            </div>
        </div>
    </div>

    <script>
        function toggleForms() {
            const login = document.getElementById('login-section');
            const signup = document.getElementById('signup-section');
            if(login.style.display === 'none') {
                login.style.display = 'block'; signup.style.display = 'none';
            } else {
                login.style.display = 'none'; signup.style.display = 'block';
            }
        }
    </script>
</body>
</html>
