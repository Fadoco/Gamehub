<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login - Acesse sua conta no GameHub.">
    <meta name="theme-color" content="#00d4ff">
    <title>GameHub - Login</title>
    
    <!-- === CSS MODULARIZADO (Mobile-First) === -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/style-global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/utilities.css">
    <link rel="stylesheet" href="../css/responsive.css">
    
    <!-- === CSS ESPECÍFICO === -->
    <link rel="stylesheet" href="../css/login.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- === PERFORMANCE MODULES === -->
    <script src="../java/lazy-image-loader.js"></script>
    
    <script src="../java/firebase-config.js"></script>
    <script src="../java/global.js" defer></script>
    <script src="../java/auth.js" defer></script>
</head>
<body>
    <div class="login-page-container">
        <div class="background-overlay"></div>

        <div class="login-card">
            <h1>GameHub</h1>
            
            <div id="login-section">
                <p>Acesse sua conta para entrar na loja</p>
                <form id="login-form">
                    <div class="form-group">
                        <input type="email" id="email" placeholder="E-mail" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="password" placeholder="Senha" required>
                    </div>
                    <p class="toggle-form" id="forgot-password-link">Esqueci minha senha</p>
                    <button type="submit" class="buy-button">Entrar no GameHub</button>
                </form>
                <p class="toggle-form" onclick="toggleForms()">Não tem conta? Cadastre-se</p>
            </div>

            <div id="signup-section" class="hidden">
                <p>Crie sua conta no GameHub</p>
                <form id="signup-form">
                    <div class="form-group"><input type="text" id="signup-name" placeholder="Nome" required></div>
                    <div class="form-group"><input type="email" id="signup-email" placeholder="E-mail" required></div>
                    <div class="form-group"><input type="password" id="signup-password" placeholder="Senha (min. 6)" required></div>
                    <button type="submit" class="buy-button">Criar Conta</button>
                </form>
                <p class="toggle-form" onclick="toggleForms()">Já tem conta? Entrar</p>
            </div>
        </div>
    </div>

    <script>
        function toggleForms() {
            const login = document.getElementById('login-section');
            const signup = document.getElementById('signup-section');
            if(login.style.display === 'none') {
                login.style.display = 'block'; signup.style.display = 'none';
            } else {
                login.style.display = 'none'; signup.style.display = 'block';
            }
        }
    </script>
</body>
</html>
