<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Roleta de Eventos - Painel de Apresentação Admin.">
    <meta name="theme-color" content="#00d4ff">
    <title>GameHub - Roleta de Eventos</title>
    
    <!-- === CSS MODULARIZADO === -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/style-global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/utilities.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/theme-switcher.css">
    <link rel="stylesheet" href="../css/header-footer.css">
    <link rel="stylesheet" href="../css/admin.css">
    
    <!-- === ÍCONES === -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- === FIREBASE === -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <script src="../java/firebase-config.js"></script>
    <script src="../java/theme-switcher.js"></script>
    <script src="../java/auth.js" defer></script>
    <script src="../java/global.js" defer></script>
    <script src="../java/admin-event-roulette.js" defer></script>

    <style>
        .event-roulette-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            align-items: center;
        }

        .roulette-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            background: linear-gradient(135deg, var(--bg-dark), var(--bg-secondary));
            border: 3px solid var(--accent);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 212, 255, 0.2);
        }

        .casino-lights {
            position: absolute;
            width: 8px;
            height: 40px;
            background: linear-gradient(90deg, #ff00ff, #00ffff);
            animation: blink 0.5s infinite;
        }

        .casino-lights.top {
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
        }

        .casino-lights.bottom {
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .roulette-selector {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 80px;
            background: linear-gradient(135deg, var(--accent), #0099cc);
            clip-path: polygon(30% 0%, 70% 0%, 100% 50%, 70% 100%, 30% 100%, 0% 50%);
            z-index: 100;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.6);
        }

        .roulette-container {
            display: flex;
            gap: 10px;
            overflow: hidden;
            height: 200px;
            padding: 20px 0;
        }

        .roulette-rail {
            display: flex;
            gap: 10px;
            transition: transform 5.7s cubic-bezier(0.15, 0, 0.05, 1);
        }

        .roulette-card {
            min-width: 120px;
            height: 160px;
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-darker));
            border: 2px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            text-align: center;
            padding: 10px;
            color: var(--text-primary);
            position: relative;
            overflow: hidden;
        }

        .roulette-card i {
            font-size: 2.5rem;
            margin-bottom: 8px;
        }

        .roulette-card.winning {
            background: linear-gradient(135deg, var(--accent), #0099cc);
            border-color: #ffff00;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.8);
            transform: scale(1.1);
        }

        .modal-result {
            background: linear-gradient(135deg, var(--bg-dark), var(--bg-secondary));
            border: 3px solid var(--accent);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            margin-top: 30px;
            box-shadow: 0 8px 32px rgba(0, 212, 255, 0.2);
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-title {
            color: var(--accent);
            font-size: 1.8rem;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .result-description {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .result-value {
            color: #2ecc71;
            font-size: 2rem;
            font-weight: 700;
            margin: 20px 0;
        }

        .result-value.negative {
            color: #e74c3c;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn-spin {
            padding: 15px 40px;
            background: linear-gradient(135deg, var(--accent), #0099cc);
            color: var(--bg-darker);
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            min-width: 200px;
        }

        .btn-spin:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0, 212, 255, 0.3);
        }

        .btn-spin:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-reset {
            padding: 15px 40px;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            min-width: 200px;
        }

        .btn-reset:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(231, 76, 60, 0.3);
        }

        .stats-panel {
            background: linear-gradient(135deg, var(--bg-dark), var(--bg-secondary));
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: var(--text-secondary);
            font-weight: 600;
        }

        .stat-value {
            color: var(--accent);
            font-weight: 700;
        }

        .back-button {
            margin-bottom: 20px;
            text-align: left;
        }

        .back-button a {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .back-button a:hover {
            color: #0099cc;
        }

        @media (max-width: 768px) {
            .roulette-wrapper {
                padding: 20px;
            }

            .button-group {
                flex-direction: column;
            }

            .btn-spin, .btn-reset {
                width: 100%;
            }

            .roulette-card {
                min-width: 100px;
                height: 140px;
                font-size: 0.8rem;
            }

            .roulette-card i {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar__left">
            <div class="brand cursor-pointer" onclick="window.location.href='../index.html'">GameHub Admin</div>
            <nav class="topbar__menu">
                <a href="admin.html">Painel Admin</a>
            </nav>
        </div>
        <div class="topbar__actions">
            <div id="user-menu" class="flex items-center gap-3"></div>
        </div>
    </header>

    <main class="container">
        <div class="back-button">
            <a href="admin.html"><i class="fas fa-arrow-left"></i> Voltar ao Painel Admin</a>
        </div>

        <div class="event-roulette-container">
            <!-- Roleta -->
            <div class="roulette-wrapper">
                <div class="casino-lights top"></div>
                <div class="casino-lights bottom"></div>
                <div class="roulette-selector"></div>
                <div class="roulette-container">
                    <div class="roulette-rail" id="roulette-rail">
                        <!-- Gerado via JS -->
                    </div>
                </div>
            </div>

            <!-- Resultado -->
            <div id="result-section" style="display: none;">
                <div class="modal-result">
                    <div class="result-title" id="result-title">🎉 Parabéns!</div>
                    <div class="result-description" id="result-description">Evento aplicado com sucesso</div>
                    <div class="result-value" id="result-value">-</div>
                    <div class="stat-item" style="justify-content: center; border: none; color: var(--text-secondary);">
                        <span id="result-count">Afetando usuários...</span>
                    </div>
                </div>
            </div>

            <!-- Controles -->
            <div class="button-group">
                <button class="btn-spin" id="btn-spin" onclick="startRoulette()">
                    <i class="fas fa-play"></i> GIRAR ROLETA
                </button>
                <button class="btn-reset" onclick="resetAllWallets()">
                    <i class="fas fa-redo"></i> Reset R$ 5.000
                </button>
            </div>

            <!-- Estatísticas -->
            <div class="stats-panel">
                <h3 style="color: var(--accent); margin-bottom: 15px;">📊 Status</h3>
                <div class="stat-item">
                    <span class="stat-label">Total de Usuários:</span>
                    <span class="stat-value" id="total-users">-</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Usuários Não-Admin:</span>
                    <span class="stat-value" id="non-admin-users">-</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Último Evento:</span>
                    <span class="stat-value" id="last-event-status">Nenhum</span>
                </div>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="container">
            <div class="footer-bottom" style="text-align: center;">
                🎲 Painel de Apresentação - Roleta de Eventos | &copy; 2026 GameHub Admin
            </div>
        </div>
    </footer>
</body>
</html>
