<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub - Painel Admin</title>
    <link rel="stylesheet" href="../css/style-global.css">
    <link rel="stylesheet" href="../css/header-footer.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/upgrades.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../java/firebase-config.js"></script>
    <script src="../java/auth.js" defer></script>
    <script src="../java/global.js" defer></script>
    <script src="../java/admin.js" defer></script>
</head>
<body>
    <header class="topbar">
        <div class="topbar__left">
            <div class="brand" onclick="window.location.href='../index.html'" style="cursor:pointer">GameHub Admin</div>
            <nav class="topbar__menu">
                <a href="biblioteca.html">Biblioteca</a>
                <a href="../Roleta/roleta.html">Roleta</a>
                <a href="ranking.html">Ranking</a>
                <a href="carrinho.html">Carrinho</a>
            </nav>
        </div>
        <div class="topbar__actions">
            <div id="user-wallet" class="wallet-widget" style="display: none;" onclick="window.location.href='historico.html'">
                <i class="fas fa-coins"></i>
                <span id="wallet-amount">R$ 0,00</span>
            </div>
            <!-- user-menu será preenchido dinamicamente por auth.js -->
            <div id="user-menu" style="display: flex; align-items: center; gap: 15px;"></div>
            <!-- btn-login será exibido se o usuário não estiver logado -->
            <button id="btn-login" class="btn btn-primary">Entrar</button>
        </div>
    </header>

    <header class="main-header" style="margin-bottom: 20px;">
        <div class="searchbar" style="max-width: 500px; margin: 0 auto;">
            <i class="fas fa-search searchbar__icon"></i>
            <input type="text" id="main-search" placeholder="Pesquisar na loja..." aria-label="Pesquisar loja">
        </div>
    </header>

    <main class="container">
        <div class="admin-grid">
            <!-- Formulário de Cadastro/Edição -->
            <section class="admin-card">
                <h2 id="form-title">Adicionar Novo Jogo</h2>
                <form id="admin-game-form">
                    <input type="hidden" id="game-firestore-id">
                    
                    <div class="form-group">
                        <label>ID Numérico (URL)</label>
                        <input type="number" id="game-id" required placeholder="Ex: 50">
                    </div>
                    
                    <div class="form-group">
                        <label>Título do Jogo</label>
                        <input type="text" id="game-title" required placeholder="Nome do Jogo">
                    </div>

                    <div class="form-group">
                        <label>URL da Imagem (Header)</label>
                        <input type="url" id="game-image" required placeholder="https://...">
                    </div>

                    <div class="form-group">
                        <label>Descrição do Jogo</label>
                        <textarea id="game-description" rows="5" placeholder="Descrição detalhada do jogo..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>Tags (separadas por vírgula)</label>
                        <input type="text" id="game-tags" required placeholder="RPG, Ação, Indie">
                    </div>

                    <div class="form-group">
                        <label>Plataformas (FontAwesome Icons)</label>
                        <input type="text" id="game-platforms" required placeholder="fab fa-windows, fab fa-playstation">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Preço Atual</label>
                            <input type="text" id="game-current-price" required placeholder="R$ 99,90">
                        </div>
                        <div class="form-group">
                            <label>Desconto (%)</label>
                            <input type="number" id="game-discount" value="0">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Preço Antigo (se houver desconto)</label>
                        <input type="text" id="game-old-price" placeholder="R$ 199,90">
                    </div>

                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="game-featured">
                        <label for="game-featured">Destaque na Home</label>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="buy-button">Salvar Jogo</button>
                        <button type="button" id="btn-cancel-edit" class="btn-see-more" style="display:none">Cancelar</button>
                    </div>
                </form>
            </section>

            <!-- Gerenciamento de Saldo -->
            <section class="admin-card">
                <h2>Enviar Dinheiro (Carteira)</h2>
                <form id="add-balance-form">
                    <div class="form-group">
                        <label>ID do Usuário (UID)</label>
                        <input type="text" id="user-id-balance" required placeholder="Cole o UID do usuário">
                    </div>
                    <div class="form-group">
                        <label>Valor a Adicionar (R$)</label>
                        <input type="number" step="0.01" id="amount-to-add" required placeholder="Ex: 50.00">
                    </div>
                    <button type="submit" class="buy-button">Adicionar ao Saldo</button>
                </form>
            </section>

            <!-- Lista de Usuários -->
            <section class="admin-card">
                <h2>Usuários Registrados</h2>
                <!-- Campo de busca para o sistema de filtro -->
                <input type="text" class="admin-search-input" placeholder="Pesquisar por nick, e-mail ou ID...">
                
                <!-- Container para os cartões com sistema de scroll -->
                <div class="user-list-container">
                    <p style="padding: 20px;">Carregando usuários...</p>
                </div>
            </section>

            <!-- Lista de Jogos -->
            <section class="admin-card">
                <h2>Gerenciar Catálogo</h2>
                <div class="admin-table-container">
                    <table id="admin-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Jogo</th>
                                <th>Preço</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="admin-game-list">
                            <!-- Preenchido via JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
