<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub - Carrinho de Compras</title>
    <link rel="stylesheet" href="../css/style global.css">
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../java/firebase-config.js"></script>
    <script src="../java/global.js" defer></script>
    <script src="../java/auth.js" defer></script>
    <script src="../java/cart.js" defer></script>
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <div class="logo" style="cursor:pointer" onclick="window.location.href='../index.html'">GameHub</div>
                <div class="nav-items">
                    <a href="../index.html" class="nav-button"><i class="fas fa-store"></i> Loja</a>
                    <a href="biblioteca.html" class="nav-button"><i class="fas fa-layer-group"></i> Biblioteca</a>
                    <div class="user-profile" id="user-menu">
                        <img src="https://ui-avatars.com/api/?name=User&background=e74c3c&color=fff" alt="Perfil">
                        <button id="btn-logout" class="nav-button" style="background:none; border:none; cursor:pointer; color:var(--accent)">Sair</button>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="store-section" style="margin-top: 40px;">
            <h1>Seu Carrinho</h1>
            <div id="cart-container">
                <div class="game-grid" id="cart-grid">
                    <!-- Itens do carrinho -->
                </div>
                
                <div id="cart-summary" style="display: none; margin-top: 30px; background: var(--bg-header); padding: 30px; border-radius: 8px; text-align: right;">
                    <h2 style="margin-bottom: 20px;">Total: <span id="cart-total">R$ 0,00</span></h2>
                    <button onclick="window.purchaseLibrary()" class="buy-button" style="max-width: 300px;">Finalizar Compra</button>
                </div>
                
                <p id="cart-empty" style="display: none; color: #bdc3c7; text-align: center; margin-top: 50px;">Seu carrinho está vazio.</p>
            </div>
        </section>
    </main>

    <!-- Overlay de Carregamento Global -->
    <div id="loading-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; justify-content: center; align-items: center; flex-direction: column;">
        <div style="width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <p style="margin-top: 15px; font-weight: bold; letter-spacing: 1px;">AGUARDE...</p>
    </div>
    <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>

    <footer class="main-footer">
        <div class="container">
            <div class="footer-bottom">
                &copy; 2026 GameHub. Todos os direitos reservados.
            </div>
        </div>
    </footer>
</body>
</html>
