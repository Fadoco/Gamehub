<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub - Resultados da Busca</title>
    <link rel="stylesheet" href="../css/style-global.css">
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="../java/global.js" defer></script>
    <script src="../java/home.js" defer></script>
    <script src="../java/search.js" defer></script>
    <script src="../java/busca.js" defer></script>
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <div class="logo" style="cursor:pointer" onclick="window.location.href='../index.html'">GameHub</div>
                <div class="nav-items">
                    <div class="search-box">
                        <input type="text" placeholder="buscar">
                        <i class="fas fa-search"></i>
                    </div>
                    <a href="#" class="nav-button"><i class="fas fa-layer-group"></i> Biblioteca</a>
                    <a href="#" class="nav-button"><i class="fas fa-shopping-cart"></i> Carrinho</a>
                    <a href="#" class="nav-button roulette"><i class="fas fa-dice"></i> Roleta</a>
                    <div class="user-profile">
                        <img src="https://ui-avatars.com/api/?name=User&background=e74c3c&color=fff" alt="Perfil">
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="back-navigation">
            <a href="../index.html" class="back-button" style="text-decoration:none; color:inherit; opacity:0.7"><i class="fas fa-arrow-left"></i> Voltar para a Loja</a>
        </div>

        <section class="store-section" style="margin-top: 20px;">
            <h2>Resultados para: "<span id="search-query-text"></span>"</h2>
            <div class="game-grid" id="grid-busca"></div>
            <div id="footer-busca" style="text-align: center; margin-top: 20px;"></div>
        </section>
    </main>

    <footer class="main-footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section"><h3>GameHub</h3><p>Sua loja independente preferida.</p></div>
                <div class="footer-section"><h3>Siga-nos</h3>
                    <div class="social-icons">
                        <a href="#"><i class="fab fa-discord"></i></a>
                        <a href="#"><i class="fab fa-instagram"></i></a>
                        <a href="#"><i class="fab fa-twitter"></i></a>
                    </div>
                </div>
            </div>
            <div class="footer-bottom">&copy; 2026 GameHub. Douglas.</div>
        </div>
    </footer>
</body>
</html>
