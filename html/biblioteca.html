<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub - Minha Biblioteca</title>
    <link rel="stylesheet" href="../css/style global.css">
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../java/firebase-config.js"></script>
    <script src="../java/global.js" defer></script>
    <script src="../java/auth.js" defer></script>
    <script src="../java/library.js" defer></script>
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <div class="logo" style="cursor:pointer" onclick="window.location.href='../index.html'">GameHub</div>
                <div class="nav-items">
                    <a href="../index.html" class="nav-button"><i class="fas fa-store"></i> Loja</a>
                    <a href="carrinho.html" class="nav-button"><i class="fas fa-shopping-cart"></i> Carrinho</a>
                    
                    <div id="user-wallet" class="wallet-widget" style="display: none;" onclick="window.location.href='historico.html'">
                        <i class="fas fa-wallet"></i>
                        <span id="wallet-amount">R$ 0,00</span>
                    </div>

                    <div class="user-profile" id="user-menu" style="display: flex;">
                        <span id="user-name" style="display:none"></span>
                        <img src="https://ui-avatars.com/api/?name=User&background=e74c3c&color=fff" alt="Perfil">
                        <button id="btn-login" class="nav-button" style="display:none">Entrar</button>
                        <button id="btn-logout" class="nav-button" style="background:none; border:none; cursor:pointer; color:var(--accent); display:none">Sair</button>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="store-section" style="margin-top: 40px;">
            <h1>Minha Biblioteca</h1>
            <p id="library-empty" style="display: none; color: #bdc3c7;">Você ainda não possui jogos. Visite a loja para começar sua coleção!</p>
            <div class="game-grid" id="library-grid">
                <!-- Jogos da biblioteca serão injetados aqui -->
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <div class="container">
            <div class="footer-bottom">
                &copy; 2026 GameHub. Todos os direitos reservados.
            </div>
        </div>
    </footer>
</body>
</html>
