<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub - Minha Biblioteca</title>
    <!-- Estilos específicos da Epic Games -->
    <link rel="stylesheet" href="../css/style-global.css">
    <link rel="stylesheet" href="../css/biblioteca.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Scripts de Integração -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../java/firebase-config.js"></script>
    <script src="../java/global.js" defer></script>
    <script src="../java/auth.js" defer></script>
    <script src="../java/search.js" defer></script>
</head>
<body>
    <header class="topbar">
        <div class="topbar__left">
            <div class="brand" onclick="window.location.href='../index.html'" style="cursor:pointer">GameHub</div>
            <nav class="topbar__menu">
                <a href="../index.html">Loja</a>
                <a href="biblioteca.html" class="active">Biblioteca</a>
                <a href="../Roleta/roleta.html">Roleta</a>
                <a href="ranking.html">Ranking</a>
            </nav>
        </div>
        <div class="topbar__actions">
            <div id="user-wallet" class="wallet-widget" style="display: none;" onclick="window.location.href='historico.html'">
                <i class="fas fa-coins"></i>
                <span id="wallet-amount">R$ 0,00</span>
            </div>
            <div class="user-profile" id="user-menu" style="display: none;">
                <span id="user-name" style="margin-right: 10px; font-size: 14px; display: none;"></span>
                <img src="https://ui-avatars.com/api/?name=User&background=e74c3c&color=fff" alt="Perfil" style="width: 35px; height: 35px; border-radius: 50%; cursor: pointer;">
                <button id="btn-login" class="btn btn-primary">Entrar</button>
                <button id="btn-logout" class="btn btn-ghost" style="display: none;">Sair</button>
            </div>
        </div>
    </header>

    <header class="main-header">
        <div class="searchbar">
            <i class="fas fa-search searchbar__icon"></i>
            <input type="text" id="main-search" placeholder="Pesquisar na loja..." aria-label="Pesquisar loja">
        </div>
        <nav class="section-nav">
            <a href="../index.html">Descobrir</a>
            <a href="ranking.html">Ranking</a>
            <a href="carrinho.html">Carrinho <span id="cart-count-badge"></span></a>
            <a class="active" href="biblioteca.html">Minha Biblioteca</a>
            <a href="perfil.html">Perfil</a>
            <a href="admin.html" id="nav-admin-link" style="display: none;">Adm</a>
        </nav>
    </header>

    <main class="container">
        <h2 class="section-title">Minha Biblioteca <span id="library-count" class="library-count-badge">0</span></h2>
        
        <!-- Grid de jogos comprados -->
        <div id="library-grid" class="game-grid">
            <!-- Injetado via JS no auth.js -->
        </div>

        <!-- Estado vazio -->
        <div id="library-empty" style="display: none;">
            <i class="fas fa-gamepad" style="font-size: 3rem; margin-bottom: 20px; color: var(--text-secondary); display: block;"></i>
            <h2>Sua biblioteca está vazia</h2>
            <p>Você ainda não possui nenhum jogo. Visite a loja para descobrir novos títulos!</p>
            <a href="../index.html" class="buy-button" style="display: inline-block; width: auto; margin-top: 20px; text-decoration: none; text-align: center;">Explorar Loja</a>
        </div>
    </main>

    <footer class="main-footer">
        <div class="container">
            <div class="footer-bottom">&copy; 2026 GameHub. Todos os direitos reservados.</div>
        </div>
    </footer>
</body>
</html>
