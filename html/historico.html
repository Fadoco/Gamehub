<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub - Histórico de Compras</title>
    <link rel="stylesheet" href="../css/style global.css">
    <link rel="stylesheet" href="../css/historico.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../java/firebase-config.js"></script>
    <script src="../java/auth.js" defer></script>
    <script src="../java/historico.js" defer></script>
    <script src="../java/global.js" defer></script>
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <div class="logo" style="cursor:pointer" onclick="window.location.href='../index.html'">GameHub</div>
                <div class="nav-items">
                    <div id="user-wallet" class="wallet-widget">
                        <i class="fas fa-wallet"></i>
                        <span id="wallet-amount">R$ 0,00</span>
                    </div>
                    <div class="user-profile" id="user-menu">
                        <img src="" alt="Perfil">
                    </div>
                </div>
            </nav>
        </div>
    </header>
    <main class="container">
        <h1>Meu Histórico de Compras</h1>
        <div id="history-list">
            <p>Carregando histórico...</p>
        </div>
    </main>
</body>
</html>
